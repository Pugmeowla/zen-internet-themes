name: Build styles.json
on:
  push:
    paths: ["styles/**", "build.py"]
  schedule:
    - cron: "0 6 * * *" # daily: pick up official theme updates
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 build.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add styles.json
          git diff --cached --quiet || (git commit -m "Rebuild styles.json" && git push)
